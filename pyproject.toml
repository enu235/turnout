[project]
name = "turnout"
version = "0.1.0"
description = "A local model router that shows its work."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
turnout = "turnout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turnout"]

[tool.hatch.build.targets.wheel.force-include]
# The starting config and the UI are runtime data, not importable modules.
"turnout/default_config.toml" = "turnout/default_config.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008 fires on FastAPI's `Body(...)` / `Query(...)` default-argument idiom,
# which is the framework's documented API rather than a mistake.
ignore = ["B008"]
